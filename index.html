<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday Aastha!</title>
<meta name="author" content="Vinit Shahdeo (original concept) — fixed & remixed">
<link rel="shortcut icon" href="./cake.png" type="image/png" />
<link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff6fa5;
    --purple:#8a5cff;
    --gold:#ffd166;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100%;
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
    background:linear-gradient(-45deg,#ff6fa5,#8a5cff,#4dd8ff,#ffd166);
    background-size:400% 400%;
    animation:gradientShift 14s ease infinite;
    color:#2b1b3d;
  }
  @keyframes gradientShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  /* ---------- canvases layered full-screen, click-through ---------- */
  #confettiCanvas, #fireworkCanvas{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:5;
  }

  .wrap{
    position:relative;z-index:10;
    max-width:900px;margin:0 auto;
    padding:40px 20px 80px;
    text-align:center;
  }

  h1.title{
    font-size:clamp(28px,6vw,56px);
    font-weight:900;
    margin:10px 0 4px;
    background:linear-gradient(90deg,#fff,#ffe066,#ff9ecb,#fff);
    background-size:300% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 3s linear infinite, pop 1.4s ease-in-out infinite;
    text-shadow:0 2px 18px rgba(0,0,0,0.15);
  }
  @keyframes shine{to{background-position:300% center;}}
  @keyframes pop{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

  .subtitle{
    font-size:clamp(14px,2.4vw,20px);
    color:#fff;opacity:.95;margin-bottom:26px;
    text-shadow:0 1px 6px rgba(0,0,0,.2);
  }

  /* ---------- balloons ---------- */
  .balloons{position:fixed;bottom:-140px;left:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:hidden;}
  .balloon{
    position:absolute;bottom:-160px;
    width:46px;height:58px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    opacity:.9;
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  .balloon::after{
    content:"";position:absolute;left:50%;top:100%;
    width:1px;height:40px;background:rgba(255,255,255,.6);
    transform:translateX(-50%);
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) rotate(0deg);}
    50%{transform:translateY(-60vh) translateX(30px) rotate(6deg);}
    100%{transform:translateY(-130vh) translateX(-20px) rotate(-6deg);}
  }

  /* ---------- cake / emoji bounce row ---------- */
  .emoji-row{font-size:38px;margin:10px 0 30px;}
  .emoji-row span{display:inline-block;animation:bounce 1.6s ease-in-out infinite;}
  .emoji-row span:nth-child(2){animation-delay:.2s;}
  .emoji-row span:nth-child(3){animation-delay:.4s;}
  .emoji-row span:nth-child(4){animation-delay:.6s;}
  .emoji-row span:nth-child(5){animation-delay:.8s;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-18px);}}

  /* ---------- code card (typewriter) ---------- */
  .card{
    background:rgba(255,255,255,.92);
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    padding:26px 28px;
    text-align:left;
    font-family:"Consolas","Monaco","Courier New",monospace;
    font-size:14px;line-height:1.7;
    color:#333;max-width:640px;margin:0 auto 30px;
    min-height:260px;
  }
  .card .comments{color:#3f7f5f;}
  .card .keyword{color:#7f0055;font-weight:bold;}
  .card .string{color:#2a36ff;}
  .cursor{display:inline-block;width:8px;background:#333;animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- countdown ---------- */
  .countdown{
    display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:20px 0 36px;
  }
  .countdown div{
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.4);
    border-radius:14px;padding:14px 18px;min-width:80px;color:#fff;
  }
  .countdown div b{display:block;font-size:28px;}
  .countdown div span{font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.85;}

  /* ---------- buttons ---------- */
  .btnRow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  button.fun{
    font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;
    padding:14px 26px;border:none;border-radius:40px;cursor:pointer;
    background:linear-gradient(90deg,var(--pink),var(--purple));
    color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.25);
    transition:transform .15s ease;
  }
  button.fun:hover{transform:translateY(-3px) scale(1.04);}
  button.fun:active{transform:translateY(0) scale(.97);}
  button.fun.alt{background:linear-gradient(90deg,var(--gold),var(--pink));}

  .wish-msg{
    margin-top:18px;font-size:18px;color:#fff;font-weight:700;
    min-height:26px;text-shadow:0 1px 6px rgba(0,0,0,.3);
  }

  footer{
    position:relative;z-index:10;text-align:center;color:#fff;
    opacity:.85;font-size:13px;padding-bottom:24px;
  }
  footer a{color:#fff;}
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<canvas id="fireworkCanvas"></canvas>
<div class="balloons" id="balloons"></div>

<div class="wrap">
  <h1 class="title" id="titleText">Happy Birthday, Aastha! 🎉</h1>
  <p class="subtitle">May your birthday bring you as much happiness as you give to everyone who knows you 💖</p>

  <div class="emoji-row">
    <span>🎂</span><span>🎈</span><span>🎁</span><span>🎉</span><span>🥳</span>
  </div>

  <div class="card" id="codeCard"></div>

  <div class="countdown" id="countdown">
    <div><b id="cd-d">--</b><span>days</span></div>
    <div><b id="cd-h">--</b><span>hrs</span></div>
    <div><b id="cd-m">--</b><span>min</span></div>
    <div><b id="cd-s">--</b><span>sec</span></div>
  </div>
  <p class="subtitle" style="margin-top:-20px;">⏳ until your next birthday countdown hits zero!</p>

  <div class="btnRow">
    <button class="fun" id="wishBtn">🎁 Make a Wish</button>
    <button class="fun alt" id="musicBtn">🎵 Play Music</button>
  </div>
  <div class="wish-msg" id="wishMsg"></div>
</div>

<audio id="bgm" src="audio/song.mp3" loop></audio>

<footer>
  Made with 💖 — original concept by <a href="https://www.facebook.com/vinit.shahdeo" target="_blank">Vinit Shahdeo</a>, remixed with extra sparkle ✨
</footer>

<script>
/* ============ EASY CONFIG — edit these two lines to reuse for anyone ============ */
const NAME = "Aastha Solanki";
const BIRTHDAY = { month: 5, day: 6 }; // month is 1-12
/* ================================================================================ */

/* ---------------- typewriter "code" card ---------------- */
const codeLines = [
  '<span class="comments">/**</span>',
  '<span class="comments"> * Today is your birthday, ' + NAME.split(" ")[0] + '.</span>',
  '<span class="comments"> * So I built a page to celebrate it. */</span>',
  'Girl u = <span class="keyword">new</span> Girl(<span class="string">"' + NAME + '"</span>);',
  '<span class="comments">// The moment the clock strikes midnight...</span>',
  'u.age++;',
  '<span class="comments">// and every day after that:</span>',
  '<span class="keyword">while</span> (true) {',
  '&nbsp;&nbsp;u.happiness++;',
  '&nbsp;&nbsp;u.fortune++;',
  '&nbsp;&nbsp;u.smiles++;',
  '}',
  '<span class="comments">// last line, plain and simple:</span>',
  'System.out.println(<span class="string">"Happy Birthday!"</span>);'
];

const card = document.getElementById('codeCard');
let lineIndex = 0, charIndex = 0;
function typeNextLine(){
  if(lineIndex >= codeLines.length) return;
  const full = codeLines[lineIndex];
  // reveal tag-safe: since lines contain html tags, type by revealing whole line quickly
  // char-by-char over plain text length, but render full HTML with a temp cut using DOM text length
  const temp = document.createElement('div');
  temp.innerHTML = full;
  const plainLen = temp.textContent.length;

  function step(){
    charIndex++;
    // render partial by rebuilding from a helper: walk the HTML string proportionally
    const ratio = Math.min(charIndex / plainLen, 1);
    card.innerHTML = renderUpTo(lineIndex, ratio) + '<span class="cursor">&nbsp;</span>';
    card.scrollTop = card.scrollHeight;
    if(charIndex < plainLen){
      setTimeout(step, 18);
    } else {
      charIndex = 0;
      lineIndex++;
      setTimeout(typeNextLine, 90);
    }
  }
  step();
}
function renderUpTo(upToLine, partialRatio){
  let out = '';
  for(let i=0;i<upToLine;i++){ out += codeLines[i] + '<br>'; }
  const cur = codeLines[upToLine];
  const temp = document.createElement('div');
  temp.innerHTML = cur;
  const full = temp.textContent;
  const count = Math.round(full.length * partialRatio);
  // simplest reliable approach: reveal the raw HTML string by character count over the tags-stripped text
  let shown = '', plainSeen = 0, i = 0;
  while(i < cur.length && plainSeen < count){
    if(cur[i] === '<'){
      const close = cur.indexOf('>', i);
      shown += cur.substring(i, close+1);
      i = close+1;
    } else {
      shown += cur[i];
      plainSeen++;
      i++;
    }
  }
  out += shown;
  return out;
}
setTimeout(typeNextLine, 500);

/* ---------------- countdown to next birthday ---------------- */
function updateCountdown(){
  const now = new Date();
  let next = new Date(now.getFullYear(), BIRTHDAY.month-1, BIRTHDAY.day, 0,0,0);
  if(next < now) next = new Date(now.getFullYear()+1, BIRTHDAY.month-1, BIRTHDAY.day, 0,0,0);
  let diff = Math.floor((next - now)/1000);
  const d = Math.floor(diff/86400); diff%=86400;
  const h = Math.floor(diff/3600); diff%=3600;
  const m = Math.floor(diff/60);
  const s = diff%60;
  document.getElementById('cd-d').textContent = d;
  document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown, 1000);

/* ---------------- balloons ---------------- */
const balloonColors = ['#ff6fa5','#8a5cff','#4dd8ff','#ffd166','#ff8c42','#7bd389'];
const balloonsWrap = document.getElementById('balloons');
for(let i=0;i<14;i++){
  const b = document.createElement('div');
  b.className = 'balloon';
  b.style.left = Math.random()*100 + 'vw';
  b.style.background = balloonColors[i % balloonColors.length];
  b.style.animationDuration = (10 + Math.random()*10) + 's';
  b.style.animationDelay = (Math.random()*12) + 's';
  b.style.width = (34 + Math.random()*24) + 'px';
  b.style.height = b.style.width;
  balloonsWrap.appendChild(b);
}

/* ---------------- confetti (continuous light drift + burst) ---------------- */
const confettiCanvas = document.getElementById('confettiCanvas');
const cctx = confettiCanvas.getContext('2d');
function resizeCanvases(){
  confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight;
  fireworkCanvas.width = window.innerWidth; fireworkCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvases);

let confetti = [];
function spawnConfetti(n, burstX, burstY){
  for(let i=0;i<n;i++){
    confetti.push({
      x: burstX!==undefined ? burstX : Math.random()*confettiCanvas.width,
      y: burstY!==undefined ? burstY : -20,
      vx: burstX!==undefined ? (Math.random()-0.5)*10 : (Math.random()-0.5)*2,
      vy: burstX!==undefined ? (Math.random()-1)*10 : 1+Math.random()*2,
      size: 4+Math.random()*6,
      color: balloonColors[Math.floor(Math.random()*balloonColors.length)],
      rot: Math.random()*360,
      vrot: (Math.random()-0.5)*10,
      life: 0
    });
  }
}
function animateConfetti(){
  cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  confetti.forEach(p=>{
    p.vy += 0.05;
    p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
    cctx.save();
    cctx.translate(p.x,p.y);
    cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    cctx.restore();
  });
  confetti = confetti.filter(p => p.y < confettiCanvas.height + 40 && p.life < 600);
  if(Math.random() < 0.12) spawnConfetti(1);
  requestAnimationFrame(animateConfetti);
}

/* ---------------- fireworks ---------------- */
const fireworkCanvas = document.getElementById('fireworkCanvas');
const fctx = fireworkCanvas.getContext('2d');
let fireworkParticles = [];
function launchFirework(x, y){
  const color = balloonColors[Math.floor(Math.random()*balloonColors.length)];
  const count = 40;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i)/count;
    const speed = 2+Math.random()*3;
    fireworkParticles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      color, life:0, maxLife: 50+Math.random()*20
    });
  }
}
function animateFireworks(){
  fctx.clearRect(0,0,fireworkCanvas.width, fireworkCanvas.height);
  fireworkParticles.forEach(p=>{
    p.vy += 0.04;
    p.x += p.vx; p.y += p.vy; p.life++;
    const alpha = Math.max(0, 1 - p.life/p.maxLife);
    fctx.fillStyle = p.color;
    fctx.globalAlpha = alpha;
    fctx.beginPath();
    fctx.arc(p.x,p.y,2.4,0,Math.PI*2);
    fctx.fill();
  });
  fctx.globalAlpha = 1;
  fireworkParticles = fireworkParticles.filter(p => p.life < p.maxLife);
  requestAnimationFrame(animateFireworks);
}
function randomFireworkBurst(){
  launchFirework(
    100 + Math.random()*(window.innerWidth-200),
    80 + Math.random()*(window.innerHeight*0.4)
  );
  setTimeout(randomFireworkBurst, 2200 + Math.random()*2500);
}

/* ---------------- init ---------------- */
resizeCanvases();
spawnConfetti(60);
animateConfetti();
animateFireworks();
setTimeout(randomFireworkBurst, 1500);

/* ---------------- Make a Wish button ---------------- */
const wishes = [
  "✨ Wish sent to the universe!",
  "🌟 May it all come true!",
  "🎊 Sparkles incoming!",
  "💫 The universe just took notes!",
  "🎆 Boom — wish launched!"
];
document.getElementById('wishBtn').addEventListener('click', (e)=>{
  spawnConfetti(120, window.innerWidth/2, window.innerHeight/2);
  launchFirework(window.innerWidth*0.3, window.innerHeight*0.35);
  launchFirework(window.innerWidth*0.7, window.innerHeight*0.3);
  document.getElementById('wishMsg').textContent = wishes[Math.floor(Math.random()*wishes.length)];
});

/* ---------------- Music toggle (autoplay-safe) ---------------- */
const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', ()=>{
  if(bgm.paused){
    bgm.play().catch(()=>{});
    musicBtn.textContent = '🔇 Pause Music';
  } else {
    bgm.pause();
    musicBtn.textContent = '🎵 Play Music';
  }
});

/* click anywhere = tiny confetti burst for fun */
document.addEventListener('click', (e)=>{
  if(e.target.closest('button')) return;
  spawnConfetti(18, e.clientX, e.clientY);
});
</script>
</body>
</html>
